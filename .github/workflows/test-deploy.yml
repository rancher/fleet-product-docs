name: Test deployment

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: test-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `paths-ignore` was removed so every PR produces both check runs: a PR that
  # skips the workflow entirely leaves a required check pending forever. A job
  # whose `if` does not match reports as skipped, which satisfies branch
  # protection, so one job name can be required on both branches.
  test-community:
    name: Test community docs
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Fails on a package.json/package-lock.json mismatch, unresolved peer
      # dependencies, and packages excluded by `engines` (.npmrc sets
      # `engine-strict`, so an unsupported Node version also fails here).
      - name: Install Antora and dependencies
        run: make environment

      - name: Build community site
        run: |
          set -o pipefail
          npx antora --stacktrace \
            --log-format=pretty \
            --log-level=info \
            --log-failure-level=warn \
            fleet-community-local-playbook.yml \
            2>&1 | tee community-build.log

          if grep -q "INFO (asciidoctor)" community-build.log; then
            echo "Asciidoctor warnings found"
            exit 1
          fi

      - name: Check community nav entries
        run: bin/files-missing-nav

  test-product:
    name: Test product docs
    runs-on: ubuntu-latest
    if: github.base_ref == 'product-docs'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Antora and dependencies
        run: make environment

      - name: Build product site
        run: |
          set -o pipefail
          npx antora --stacktrace \
            --log-format=pretty \
            --log-level=info \
            --log-failure-level=warn \
            fleet-product-local-playbook.yml \
            2>&1 | tee product-build.log

          if grep -q "INFO (asciidoctor)" product-build.log; then
            echo "Asciidoctor warnings found"
            exit 1
          fi

      - name: Check product nav entries
        run: bin/files-missing-nav
